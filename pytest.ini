[pytest]
; This machine has a stray personal script literally named `outcome.py`
; sitting in the Python install root, which is on sys.path by default.
; It shadows the real `outcome` package (pulled in transitively via
; anthropic -> httpx -> httpcore's optional trio support), which the
; anyio pytest plugin imports during its own plugin bootstrap -- before
; any conftest.py runs, so a sys.path fixup there is too late. This
; suite has no async tests, so disabling the plugin is a safe fix.
addopts = -p no:anyio
